<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Urekka Health Care | Dr. Prabash Nayak – Urologist Surgeon &amp; Andrologist, Cuttack</title>
<meta name="description" content="Urekka Health Care – Dr. Prabash Nayak, Urologist Surgeon &amp; Andrologist in Mahanadi Vihar, Cuttack. Share your experience, save contact details, call, WhatsApp or get directions.">
<meta name="theme-color" content="#1F7A85">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  /* ---------- THEME (taken from the Urekka brochure): change for another business ---------- */
  :root{
    --primary:#1F7A85;      /* brochure teal, darkened so white text on it = 5:1 */
    --primary-dark:#165F68;
    --charcoal:#2E3A3F;     /* brochure dark facets */
    --blue:#2F7FC0;         /* brochure "UREKKA" wordmark blue */
    --green:#4CAF50;        /* brochure "+" mark */
    --star:#D4A23A;         /* gold stars (decorative) */
    --bg:#EEF3F3;           /* off-white base */
    --ink:#18262C;          /* main text */
    --muted:#3F4D56;        /* secondary text */
    --glass:rgba(255,255,255,.74);        /* frosted panels */
    --glass-soft:rgba(255,255,255,.58);   /* controls inside panels */
    --glass-border:rgba(255,255,255,.8);
    --serif:"Playfair Display", Georgia, "Times New Roman", serif;
    --sans:"DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --shadow:0 10px 32px rgba(20,60,70,.16);
  }
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;overflow-x:hidden;min-height:100vh}
  img,svg,iframe{max-width:100%}
  a{color:var(--primary)}
  .wrap{position:relative;max-width:480px;margin:0 auto;padding:24px 16px 40px}
  .sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

  :where(a,button):focus-visible{outline:3px solid var(--primary);outline-offset:3px;border-radius:12px}
  .btn-primary:focus-visible,.pill[aria-pressed="true"]:focus-visible{outline-color:var(--charcoal)}

  /* ---------- Faceted brochure background ---------- */
  .bg{position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(160deg,#F6F9F9 0%,#E4EEEF 100%)}
  .bg svg{position:absolute;inset:0;width:100%;height:100%;max-width:none}

  /* ---------- Glass panels ---------- */
  .card{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--glass-border);border-radius:24px;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.9);padding:20px 18px;margin-bottom:18px}
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.card{background:rgba(255,255,255,.93)}}
  @media (prefers-reduced-transparency:reduce){.card{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(255,255,255,.96)}}

  .rule{height:1px;border:0;margin:18px 0;background:linear-gradient(90deg,transparent,var(--primary),var(--blue),transparent);opacity:.55}
  .label{font-size:.75rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}

  /* ---------- Header ---------- */
  .hero{text-align:center;padding:24px 18px 22px}
  .logo{width:104px;height:104px;margin:0 auto 12px;display:block;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--primary),0 8px 24px rgba(20,60,70,.22);object-fit:cover;object-position:center 35%;background:#fff}
  .brand{font-family:var(--serif);font-weight:700;font-size:clamp(1.9rem,9vw,2.4rem);line-height:1.1;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);margin:0}
  .hc{display:flex;align-items:center;gap:10px;margin:2px auto 12px;max-width:260px;font-size:.9rem;color:var(--muted)}
  .hc::before,.hc::after{content:"";flex:1;height:1px;background:var(--muted);opacity:.55}
  .doc{font-family:var(--serif);font-weight:600;font-size:1.2rem;margin:0}
  .biz-type{margin:2px 0 0;color:var(--muted);font-size:.98rem}
  .stars{color:var(--star);font-size:1.7rem;letter-spacing:.2em;margin:14px 0 4px;padding-left:.2em}
  .eyebrow{margin:0;font-size:.78rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}

  /* ---------- Pills ---------- */
  .pills{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px;padding:0;list-style:none}
  .pill{min-height:34px;padding:0 11px;border-radius:999px;border:1.5px solid var(--glass-border);background:var(--glass-soft);box-shadow:0 2px 8px rgba(20,60,70,.08),inset 0 1px 0 rgba(255,255,255,.9);color:var(--ink);font:500 .8rem var(--sans);cursor:pointer;transition:background .15s,color .15s,border-color .15s,transform .1s}
  .pill[aria-pressed="true"]{background:linear-gradient(135deg,var(--primary),var(--primary-dark));border-color:var(--primary);color:#fff;box-shadow:0 4px 14px rgba(31,122,133,.4),inset 0 1px 0 rgba(255,255,255,.3)}
  .pill:active{transform:scale(.96)}
  @media (hover:hover){.pill:hover{border-color:var(--primary)}}

  /* ---------- Language switch ---------- */
  .lang-row{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:16px;font-size:.82rem;font-weight:700;letter-spacing:.14em}
  .lang-row span{color:var(--muted);transition:color .15s}
  .lang-row span.on{color:var(--primary)}
  .switch{min-width:64px;min-height:44px;padding:0;border:0;background:transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
  .switch .track{width:52px;height:30px;border-radius:999px;background:#7E8E96;position:relative;transition:background .2s;box-shadow:inset 0 1px 3px rgba(0,0,0,.25)}
  .switch .thumb{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:transform .2s}
  .switch[aria-checked="true"] .track{background:var(--primary)}
  .switch[aria-checked="true"] .thumb{transform:translateX(22px)}

  /* ---------- Review box ---------- */
  .reviews{display:grid;gap:10px;margin-bottom:10px}
  .review{display:block;position:relative;cursor:pointer;background:var(--glass-soft);border:1.5px solid var(--glass-border);box-shadow:inset 0 1px 0 rgba(255,255,255,.9);border-radius:18px;padding:14px 16px;transition:border-color .15s,box-shadow .15s}
  .review.sel{border-color:var(--primary);box-shadow:0 0 0 3px rgba(31,122,133,.22),inset 0 1px 0 rgba(255,255,255,.9)}
  .review:has(input:focus-visible){outline:3px solid var(--primary);outline-offset:3px}
  .rv-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .rv-head .label{margin:0}
  .dot{width:22px;height:22px;border-radius:50%;border:2px solid #7E8E96;background:#fff;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:.8rem;font-weight:700;line-height:1;transition:background .15s,border-color .15s}
  .review.sel .dot{background:var(--primary);border-color:var(--primary)}
  .review-text{margin:0;font-size:1rem;line-height:1.65;overflow-wrap:anywhere}
  .hint{margin:0 0 14px;font-size:.84rem;color:var(--muted)}
  .actions{display:flex;gap:10px}

  /* ---------- Buttons ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 20px;border-radius:16px;font:700 .92rem var(--sans);letter-spacing:.06em;text-transform:uppercase;text-decoration:none;cursor:pointer;border:1.5px solid var(--primary);transition:background .15s,transform .1s,box-shadow .15s;text-align:center}
  .btn svg{width:20px;height:20px;flex:none}
  .btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;box-shadow:0 6px 18px rgba(31,122,133,.35),inset 0 1px 0 rgba(255,255,255,.3)}
  .btn-outline{background:var(--glass-soft);color:var(--primary-dark);border-color:rgba(31,122,133,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
  .btn:active{transform:scale(.98)}
  @media (hover:hover){.btn-primary:hover{box-shadow:0 8px 24px rgba(31,122,133,.5),inset 0 1px 0 rgba(255,255,255,.3)}.btn-outline:hover{background:rgba(255,255,255,.85)}}
  .btn-block{width:100%}
  .actions .btn-primary{flex:1}
  .btn-square{width:52px;padding:0;font-size:1.5rem;line-height:1;flex:none}

  /* ---------- Icon tiles ---------- */
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
  .tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:92px;padding:14px 6px;border-radius:20px;border:1px solid var(--glass-border);background:var(--glass-soft);box-shadow:0 2px 10px rgba(20,60,70,.08),inset 0 1px 0 rgba(255,255,255,.9);color:var(--ink);text-decoration:none;font-size:.85rem;font-weight:500;text-align:center;transition:transform .1s,border-color .15s,box-shadow .15s}
  .tile svg{width:28px;height:28px;color:var(--primary);fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tile:active{transform:scale(.97)}
  @media (hover:hover){.tile:hover{border-color:var(--primary);box-shadow:var(--shadow)}}

  /* ---------- Phone numbers ---------- */
  .numbers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .num{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 10px;border-radius:14px;border:1px solid var(--glass-border);background:var(--glass-soft);box-shadow:inset 0 1px 0 rgba(255,255,255,.9);color:var(--ink);text-decoration:none;font-weight:500;font-size:.92rem;white-space:nowrap}
  .num svg{width:16px;height:16px;color:var(--primary);fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
  @media (hover:hover){.num:hover{border-color:var(--primary)}}

  /* ---------- Location + story ---------- */
  h2{font-family:var(--serif);font-weight:600;font-size:1.35rem;margin:0 0 8px}
  .address{margin:0 0 14px;color:var(--muted)}
  .map{position:relative;width:100%;aspect-ratio:4/3;border-radius:18px;overflow:hidden;border:1px solid var(--glass-border);box-shadow:0 4px 16px rgba(20,60,70,.12);background:var(--bg)}
  .map iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .maplink{display:inline-flex;align-items:center;min-height:44px;margin-top:6px;font-weight:700;color:var(--primary-dark)}
  .story h2{text-transform:uppercase;letter-spacing:.12em;font-size:1.1rem}
  .story p{margin:0 0 12px}
  .story p:last-child{margin-bottom:0}

  /* ---------- Footer ---------- */
  .footer{text-align:center;padding:22px 18px 20px}
  .footer h2{text-transform:uppercase;letter-spacing:.14em;font-size:1.05rem}
  .footer p{margin:0 0 16px;color:var(--muted)}
  .footer .btns{display:flex;flex-direction:column;gap:10px}
  .footer p.copy{font-size:.82rem;margin:22px 0 0}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{transition:none !important;animation:none !important;scroll-behavior:auto !important}
  }
</style>
</head>

<main class="wrap">

  <!-- 1. HEADER & RATING -->
  <header class="hero card">
    <div id="logoSlot"></div>
    <h1 class="brand" data-bind="brand">Urekka</h1>
    <p class="hc"><span>Health Care</span></p>
    <p class="doc" data-bind="name">Dr. Prabash Nayak</p>
    <p class="biz-type" data-bind="type">Urologist Surgeon &amp; Andrologist</p>
    <div class="stars" aria-hidden="true">★ ★ ★ ★ ★</div>
    <p class="eyebrow">Share your experience</p>
  </header>

  <!-- 2. REVIEW GENERATOR -->
  <section class="card" aria-labelledby="genTitle">
    <h2 id="genTitle" class="sr-only">Create your review</h2>
    <p class="label" id="pillLabel">What stood out?</p>
    <ul class="pills" id="pills" aria-labelledby="pillLabel"></ul>

    <div class="lang-row">
      <span id="lblEn" class="on">ENGLISH</span>
      <button type="button" class="switch" id="langSwitch" role="switch" aria-checked="false" aria-label="Switch review language between English and Hinglish">
        <span class="track"><span class="thumb"></span></span>
      </button>
      <span id="lblHi">HINGLISH</span>
    </div>

    <p class="label" id="reviewLabel">YOUR REVIEW</p>
    <div class="reviews" role="radiogroup" aria-labelledby="reviewLabel" aria-live="polite">
      <label class="review sel" id="cardLong">
        <input type="radio" name="reviewPick" value="long" class="sr-only" checked>
        <span class="rv-head"><span class="label" id="tagLong">LONG</span><span class="dot" aria-hidden="true">✓</span></span>
        <p class="review-text" id="textLong"></p>
      </label>
      <label class="review" id="cardShort">
        <input type="radio" name="reviewPick" value="short" class="sr-only">
        <span class="rv-head"><span class="label" id="tagShort">SHORT</span><span class="dot" aria-hidden="true">✓</span></span>
        <p class="review-text" id="textShort"></p>
      </label>
    </div>
    <p class="hint" id="reviewHint"></p>

    <div class="actions">
      <button type="button" class="btn btn-primary" id="copyBtn">Copy &amp; paste on Google</button>
      <button type="button" class="btn btn-outline btn-square" id="shuffleBtn" aria-label="Generate a new review">↻</button>
    </div>
    <p class="sr-only" id="copyStatus" role="status"></p>
  </section>

  <!-- 3. CONTACT & SOCIAL HUB -->
  <section class="card" aria-labelledby="contactTitle">
    <h2 id="contactTitle" class="sr-only">Quick contact</h2>
    <button type="button" class="btn btn-primary btn-block" id="saveContact">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Save Contact
    </button>
    <div class="tiles" id="tiles"></div>
    <div class="numbers" id="numbers"></div>
  </section>

  <!-- 4. LOCATION & STORY -->
  <section class="card" aria-labelledby="locTitle">
    <h2 id="locTitle">Find Us</h2>
    <p class="address" id="addressText"></p>
    <div class="map"><iframe id="mapFrame" title="Map showing the clinic location" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe></div>
    <a class="maplink" id="mapLink" target="_blank" rel="noopener">Open in Google Maps →</a>
    <hr class="rule">
    <div class="story" id="story"></div>
  </section>

  <footer class="footer card">
    <h2>Visit &amp; Connect</h2>
    <p id="footText"></p>
    <div class="btns">
      <a class="btn btn-primary" id="footFollow" target="_blank" rel="noopener"></a>
      <a class="btn btn-outline" id="footReview" target="_blank" rel="noopener">Leave a Review</a>
    </div>
    <p class="copy" id="copyright"></p>
  </footer>
</main>

/* =====================================================================
   Code below needs no changes for a new business.
   ===================================================================== */
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var state = { selected: new Set(["all"]), lang: "en", reviews: { long: "", short: "" }, pick: "long", copyTimer: null };
  function intl(n) { return "+91" + n; }
  function nice(n) { return "+91 " + n.slice(0, 5) + " " + n.slice(5); }
  var allPhones = [CONFIG.phone].concat(CONFIG.morePhones || []);
  var waLink = "https://wa.me/91" + CONFIG.phone + "?text=" + encodeURIComponent(CONFIG.waText);
  var q = encodeURIComponent(CONFIG.name + ", " + CONFIG.fullAddress);

  /* ---------- helpers ---------- */
  function shuffle(a) {
    var arr = a.slice();
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  /* ---------- static content from CONFIG ---------- */
  function renderStatic() {
    document.querySelectorAll("[data-bind]").forEach(function (n) { n.textContent = CONFIG[n.getAttribute("data-bind")]; });

    var slot = $("logoSlot");
    if (CONFIG.logoSrc) {
      var img = el("img", "logo");
      img.src = CONFIG.logoSrc; img.alt = CONFIG.logoAlt || (CONFIG.brandFull + " logo"); img.width = 104; img.height = 104;
      slot.appendChild(img);
    } else {
      slot.innerHTML =
        '<svg class="logo" viewBox="0 0 92 92" role="img" aria-label="' + CONFIG.brandFull + ' logo">' +
        '<circle cx="46" cy="46" r="46" fill="#ffffff"/>' +
        '<circle cx="46" cy="46" r="42" fill="none" stroke="#3E9FA8" stroke-width="2"/>' +
        '<text x="43" y="57" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#2E3A3F">' + CONFIG.initials + '</text>' +
        '<path d="M70 14h6v6h6v6h-6v6h-6v-6h-6v-6h6z" fill="#4CAF50"/></svg>';
    }

    $("addressText").textContent = CONFIG.fullAddress + ", " + CONFIG.country;
    $("mapFrame").src = "https://www.google.com/maps?q=" + q + "&output=embed";
    $("mapLink").href = "https://www.google.com/maps/search/?api=1&query=" + q;

    var story = $("story");
    story.appendChild(el("h2", "", "Our Story"));
    COPY.ui.story.forEach(function (p) { story.appendChild(el("p", "", p)); });

    var hasIG = !!CONFIG.instagram;
    var follow = $("footFollow");
    follow.href = hasIG ? CONFIG.instagram : waLink;
    follow.textContent = hasIG ? COPY.ui.followLabel : COPY.ui.followFallbackLabel;
    $("footText").textContent = hasIG ? COPY.ui.footerWithSocial : COPY.ui.footerNoSocial;
    $("footReview").href = CONFIG.googleReviewLink;
    $("footReview").textContent = COPY.ui.reviewLabel;
    $("copyright").textContent = "© " + new Date().getFullYear() + " " + CONFIG.brandFull + ". All rights reserved.";
  }

  /* ---------- icon tiles + number chips ---------- */
  var ICONS = {
    instagram: '<rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>',
    facebook: '<path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>',
    whatsapp: '<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>',
    call: '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>',
    google: '<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>',
    website: '<circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>'
  };
  function renderTiles() {
    var items = [
      { key: "instagram", label: "Instagram",   href: CONFIG.instagram,      aria: "Open Instagram" },
      { key: "facebook",  label: "Facebook",    href: CONFIG.facebook,       aria: "Open Facebook" },
      { key: "whatsapp",  label: "WhatsApp",    href: waLink,                aria: "Chat on WhatsApp" },
      { key: "call",      label: "Call Us",     href: "tel:" + intl(CONFIG.phone), aria: "Call " + nice(CONFIG.phone), internal: true },
      { key: "google",    label: "Google Page", href: CONFIG.googlePageLink, aria: "Open Google Business page" },
      { key: "website",   label: "Website",     href: CONFIG.website,        aria: "Open website" }
    ];
    var box = $("tiles");
    items.forEach(function (it) {
      if (!it.href) return;                       // empty link = tile hidden
      var a = el("a", "tile");
      a.href = it.href;
      a.setAttribute("aria-label", it.aria);
      if (!it.internal) { a.target = "_blank"; a.rel = "noopener"; }
      a.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[it.key] + '</svg><span>' + it.label + '</span>';
      box.appendChild(a);
    });

    var nums = $("numbers");
    allPhones.forEach(function (n) {
      var a = el("a", "num");
      a.href = "tel:" + intl(n);
      a.setAttribute("aria-label", "Call " + nice(n));
      a.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS.call + '</svg><span>' + nice(n) + '</span>';
      nums.appendChild(a);
    });
  }

  /* ---------- pills ---------- */
  function renderPills() {
    var ul = $("pills");
    ul.innerHTML = "";
    CATEGORIES.forEach(function (c) {
      var li = el("li");
      var b = el("button", "pill", c.label);
      b.type = "button";
      b.dataset.id = c.id;
      b.setAttribute("aria-pressed", state.selected.has(c.id) ? "true" : "false");
      b.addEventListener("click", function () { togglePill(c.id); });
      li.appendChild(b);
      ul.appendChild(li);
    });
  }
  function togglePill(id) {
    if (id === "all") {
      state.selected = new Set(["all"]);               // "All" is exclusive
    } else {
      state.selected.delete("all");                    // any other pill clears "All"
      if (state.selected.has(id)) state.selected.delete(id); else state.selected.add(id);
      if (state.selected.size === 0) state.selected.add("all");   // empty falls back to All
    }
    document.querySelectorAll("#pills .pill").forEach(function (b) {
      b.setAttribute("aria-pressed", state.selected.has(b.dataset.id) ? "true" : "false");
    });
    generate();
  }

  /* ---------- review generation ---------- */
  function pool() {
    return state.selected.has("all")
      ? CATEGORIES.filter(function (c) { return c.id !== "all"; }).map(function (c) { return c.id; })
      : Array.from(state.selected);
  }
  // LONG review: intro + up to 4 phrases + closer
  function buildLong() {
    var L = COPY[state.lang];
    var ids = shuffle(pool()).slice(0, 4);
    var parts = ids.map(function (id) { return pick(L.phrases[id]); });
    var conns = shuffle(L.connectors);
    var text = pick(L.intros) + " " + cap(parts[0]) + ".";
    for (var i = 1; i < parts.length; i++) text += " " + conns[i - 1] + " " + parts[i] + ".";
    return text + " " + pick(L.closers);
  }
  // SHORT review: short intro + 1 or 2 phrases + short closer
  function buildShort() {
    var L = COPY[state.lang];
    var ids = shuffle(pool()).slice(0, 2);
    var parts = ids.map(function (id) { return pick(L.phrases[id]); });
    var text = pick(L.shortIntros) + " " + cap(parts[0]) + ".";
    if (parts[1]) text += " " + pick(L.shortConnectors) + " " + parts[1] + ".";
    return text + " " + pick(L.shortClosers);
  }
  function generate() {
    ["long", "short"].forEach(function (kind) {
      var make = kind === "long" ? buildLong : buildShort;
      var t = make(), tries = 0;
      while (t === state.reviews[kind] && tries++ < 12) t = make();   // avoid showing the same text twice in a row
      state.reviews[kind] = t;
      $(kind === "long" ? "textLong" : "textShort").textContent = t;
    });
  }
  function applyPick() {
    $("cardLong").classList.toggle("sel", state.pick === "long");
    $("cardShort").classList.toggle("sel", state.pick === "short");
  }
  document.querySelectorAll('input[name="reviewPick"]').forEach(function (r) {
    r.addEventListener("change", function () { state.pick = r.value; applyPick(); });
  });
  // On page open: pre-select 2 or 3 random categories so every visit shows a different review
  function autoSelect() {
    var ids = CATEGORIES.filter(function (c) { return c.id !== "all"; }).map(function (c) { return c.id; });
    var n = 2 + Math.floor(Math.random() * 2);
    state.selected = new Set(shuffle(ids).slice(0, n));
  }

  /* ---------- language switch ---------- */
  function applyLang() {
    var hi = state.lang === "hi";
    $("langSwitch").setAttribute("aria-checked", hi ? "true" : "false");
    $("lblEn").classList.toggle("on", !hi);
    $("lblHi").classList.toggle("on", hi);
    $("reviewLabel").textContent = COPY[state.lang].cardLabel;
    $("tagLong").textContent = COPY[state.lang].longLabel;
    $("tagShort").textContent = COPY[state.lang].shortLabel;
    $("reviewHint").textContent = COPY[state.lang].hint;
    document.documentElement.setAttribute("lang", "en");          // Hinglish is Latin-script; keep lang=en
  }
  $("langSwitch").addEventListener("click", function () {
    state.lang = state.lang === "en" ? "hi" : "en";
    applyLang();
    generate();
  });
  $("shuffleBtn").addEventListener("click", generate);

  /* ---------- copy + open Google ---------- */
  function legacyCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, text.length);
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    return ok;
  }
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return legacyCopy(text); });
    }
    return Promise.resolve(legacyCopy(text));
  }
  $("copyBtn").addEventListener("click", function () {
    var btn = $("copyBtn");
    var done = copyText(state.reviews[state.pick]);              // copies whichever review (long/short) is selected
    if (CONFIG.googleReviewLink) window.open(CONFIG.googleReviewLink, "_blank", "noopener");
    done.then(function (ok) {
      if (!ok) return;
      btn.textContent = COPY.ui.copiedLabel;
      $("copyStatus").textContent = COPY.ui.copiedStatus;
      clearTimeout(state.copyTimer);
      state.copyTimer = setTimeout(function () {
        btn.textContent = COPY.ui.copyLabel;
        $("copyStatus").textContent = "";
      }, 2000);
    });
  });

  /* ---------- vCard 3.0 download ---------- */
  function esc(s) { return String(s).replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/,/g, "\\,").replace(/;/g, "\\;"); }
  $("saveContact").addEventListener("click", function () {
    var lines = [
      "BEGIN:VCARD",
      "VERSION:3.0",
      "N:" + esc(CONFIG.vcardLast) + ";" + esc(CONFIG.vcardFirst) + ";;" + esc(CONFIG.vcardPrefix) + ";",
      "FN:" + esc(CONFIG.name),
      "ORG:" + esc(CONFIG.brandFull),
      "TITLE:" + esc(CONFIG.type)
    ];
    allPhones.forEach(function (n, i) { lines.push("TEL;TYPE=" + (i === 0 ? "CELL,VOICE,PREF" : "CELL,VOICE") + ":" + intl(n)); });
    lines.push("URL:" + (CONFIG.website || CONFIG.googlePageLink));
    lines.push("ADR;TYPE=WORK:;;" + esc(CONFIG.street) + ";" + esc(CONFIG.city) + ";" + esc(CONFIG.region) + ";" + esc(CONFIG.postal) + ";" + esc(CONFIG.country));
    lines.push("END:VCARD");
    var blob = new Blob([lines.join("\r\n") + "\r\n"], { type: "text/vcard;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = COPY.ui.saveFile;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  });

  /* ---------- init ---------- */
  $("copyBtn").textContent = COPY.ui.copyLabel;
  renderStatic();
  renderTiles();
  if (CONFIG.autoSelectOnOpen) autoSelect();
  renderPills();
  applyLang();
  applyPick();
  generate();
})();
</script>
